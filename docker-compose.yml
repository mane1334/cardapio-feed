# Servidor com HTTPS automático (Caddy) + a app. Uso:
#   1. Aponta o teu domínio (registo A) para o IP do servidor
#   2. cp .env.example .env   e define DOMAIN=cardapio.teudominio.co.mz
#   3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1"
    volumes:
      - dados:/data
    expose:
      - "3001"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN no ficheiro .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  dados:
  caddy_data:
  caddy_config:
