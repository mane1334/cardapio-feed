<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f0e4">
  <title>Painel do restaurante</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/painel.css">
</head>
<body>
  <section id="login" class="login" hidden></section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="who">
        <b id="rName"></b>
        <a id="viewLink" target="_blank" rel="noopener">Ver cardápio ↗</a>
      </div>
      <div class="top-actions">
        <span id="live" class="live off" title="Ligação em tempo real">● offline</span>
        <button id="btnSound" class="icon-btn" type="button" aria-label="Som dos pedidos" title="Som dos pedidos">🔔</button>
      </div>
    </header>
    <nav class="tabs" id="tabs" aria-label="Secções"></nav>
    <main id="view"></main>
  </div>

  <div id="printArea" aria-hidden="true"></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Ativa o JavaScript para usar o painel.</p></noscript>
  <script src="/painel.js" defer></script>
</body>
</html>
